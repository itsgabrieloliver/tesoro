[package]
name = "tesoro"
version = "0.2.0"
edition = "2024"
authors = ["Gabriel Oliver <gabrielo@withnubo.com>"]
license = "Proprietary"
description = "Obsidian-compatible note-taking TUI for the terminal"

[[bin]]
name = "teso"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
pulldown-cmark = "0.13.4"
regex = "1.12.3"
ignore = "0.4.25"
textwrap = "0.16.2"
unicode-width = "=0.2.0"
lru = "0.18.0"
serde_yaml_ng = "0.10.0"
nucleo-matcher = "0.3.1"
notify-debouncer-full = "0.7.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
minijinja = "2.20.0"
tui-textarea = "0.7.0"
arboard = "3.6.1"

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
tempfile = "3.27.0"
